# Used only when running `alembic` directly from a checkout. Prefer `argus db migrate`, which
# reads the same settings and runs as the owner role (ARGUS_DATABASE__MIGRATION_URL).
# The database URL is NOT stored here: env.py loads it from ARGUS_* settings.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
