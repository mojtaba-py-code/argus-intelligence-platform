name: Set up the Python environment
description: >-
  Install uv and Python, then the locked environment (runtime + all extras + the dev group).
  `uv sync --locked` fails when uv.lock is out of date with pyproject.toml.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.23"  # same as the Dockerfile
        python-version: ${{ inputs.python-version }}
        enable-cache: false  # no cache that a pull request could poison

    - name: Install the locked environment
      shell: bash
      run: uv sync --locked --all-extras
