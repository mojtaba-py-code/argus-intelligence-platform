# Weekly dependency updates with a 7-day cooldown: a compromised or broken release is usually
# yanked before it reaches this repository. Security updates are not delayed (they are raised as
# soon as an advisory is published - repository setting "Dependabot security updates").
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Major versions of data services change on-disk formats; upgraded deliberately.
      - dependency-name: pgvector/pgvector
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /deploy/observability
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      observability:
        patterns: ["*"]
