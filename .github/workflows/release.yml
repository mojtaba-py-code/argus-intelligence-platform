# Release: a version tag (vX.Y.Z) on a commit that passes the full CI becomes a signed image.
#
#   1. the complete CI workflow runs again on the tagged commit (nothing unverified ships);
#   2. the image is built for amd64 and arm64 with BuildKit SBOM (SPDX) and SLSA provenance
#      attestations, and pushed to GHCR by digest;
#   3. Trivy scans the pushed digest (fixable HIGH/CRITICAL fail the release);
#   4. cosign signs the digest keylessly (Sigstore, GitHub OIDC identity of this workflow) and
#      the signature is verified against that identity before the job succeeds.
#
# Deploy by digest, verifying first (docs/operations/deployment.md):
#   cosign verify ghcr.io/<owner>/<repo>@sha256:... \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The `release` environment should require a reviewer: pushing a tag alone never publishes.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Full CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read  # the secret-scan job of the called workflow needs it

  image:
    name: Build, scan, sign and publish the image
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing: an OIDC token proves which workflow signed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}

      - name: Vulnerability scan of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the digest (keyless) and verify the signature
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REF}"
          cosign verify "${REF}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signed and verified: ${REF}" >> "$GITHUB_STEP_SUMMARY"
