# Live model evaluation (spec §27): the default dataset against the real configured models.
#
# Manual only. The API key lives in the protected `model-evaluation` environment (configure
# required reviewers there), so a pull request can never spend money or read the key. The run
# uses a throw-away PostgreSQL service with the platform's least-privilege roles, and every
# outbound prompt is recorded by the runner to prove that canaries never leave.

name: Live model evaluation

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Case tags to run, comma-separated (empty = all cases)
        required: false
        default: ""
      repeat:
        description: Runs per case (2 or more also measures consistency)
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate live models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: model-evaluation
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:cd4ccfdaf62cbfeb5c6ee19ef0dd663406d4ed740c320b324d016a90e85385b3
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARGUS_ENVIRONMENT: development
      ARGUS_DATABASE__URL: postgresql://argus_app:eval-app@127.0.0.1:5432/argus
      ARGUS_DATABASE__MIGRATION_URL: postgresql://argus_owner:eval-owner@127.0.0.1:5432/argus
      ARGUS_DATABASE__TLS_MODE: disable
      ARGUS_OBSERVABILITY__LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Create the least-privilege roles and the database
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE argus_owner LOGIN PASSWORD 'eval-owner'" \
            -c "CREATE ROLE argus_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'eval-app'" \
            -c "CREATE DATABASE argus OWNER argus_owner"
          psql -h 127.0.0.1 -U postgres -d argus -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector"
      - name: Migrate
        run: uv run argus db migrate
      - name: Evaluate
        env:
          ARGUS_LLM__ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAGS: ${{ inputs.tags }}
          REPEAT: ${{ inputs.repeat }}
        run: >-
          uv run argus eval run --live
          --repeat "${REPEAT}" --tags "${TAGS}"
          --baseline evals/baseline-live.json
          --output eval-live.json
      - name: Upload the evaluation result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-live
          path: eval-live.json
          if-no-files-found: warn
          retention-days: 30
