# Prometheus for the local observability stack (compose.observability.yml).
# Production: the same jobs with `authorization: {type: Bearer, credentials_file: ...}` holding
# ARGUS_OBSERVABILITY__METRICS_TOKEN, and service discovery instead of static targets.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: argus-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: argus-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: argus-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9100"]
