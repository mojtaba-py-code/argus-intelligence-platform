# Local observability stack on top of docker-compose.yml:
#   OpenTelemetry Collector (scrubs attributes) -> Jaeger (traces)
#   Prometheus (scrapes api, worker and scheduler; evaluates the alert rules)
#   Grafana (the Argus dashboard, provisioned read-only)
#
#   docker compose -f docker-compose.yml -f deploy/observability/compose.observability.yml up --build
#
# UIs (bound to 127.0.0.1 only): Grafana http://127.0.0.1:3000 (user admin, password
# GRAFANA_ADMIN_PASSWORD from .env), Jaeger http://127.0.0.1:16686, Prometheus
# http://127.0.0.1:9090. Paths are relative to the project directory (the first compose file).
# Every image is pinned by digest, like the main stack. Development settings: every trace is
# kept (sample ratio 1.0) and /metrics needs no token inside the compose network.

x-telemetry-env: &telemetry-env
  ARGUS_OBSERVABILITY__OTEL_ENABLED: "true"
  ARGUS_OBSERVABILITY__OTEL_ENDPOINT: http://otel-collector:4318
  ARGUS_OBSERVABILITY__OTEL_SAMPLE_RATIO: "1.0"
  ARGUS_OBSERVABILITY__METRICS_PORT: "9100"
  ARGUS_OBSERVABILITY__METRICS_HOST: 0.0.0.0

services:
  api:
    environment: *telemetry-env
  worker:
    environment: *telemetry-env
  scheduler:
    environment: *telemetry-env

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1-386@sha256:cc79ec8a69421354e7dbcc524d34cbe9a88bb08ed601f5b7b2a55387392f1aba
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [jaeger]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports: ["127.0.0.1:16686:16686"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
