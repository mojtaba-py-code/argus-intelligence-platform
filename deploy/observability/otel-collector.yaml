# OpenTelemetry Collector between Argus and the trace store.
#
# Argus already sends allow-listed attributes only. The collector is the second line: it deletes
# attribute keys that must never be stored, even if a future change (or a library) adds them,
# and it bounds its own memory so a burst of spans cannot take it down.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  attributes/scrub:
    actions:
      - {key: url.full, action: delete}
      - {key: url.query, action: delete}
      - {key: http.url, action: delete}
      - {key: http.target, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: user.email, action: delete}
      - {key: enduser.id, action: delete}
      - {key: db.query.parameters, action: delete}
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true  # compose network only; production exports over TLS

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/jaeger]
  telemetry:
    logs:
      level: warn
