# NOT applied by kustomize and never filled in here. Create these two Secrets from your secret
# store (External Secrets Operator, Vault Agent, Sealed Secrets, your cloud's CSI driver...).
# Generate the key material with:  argus keys generate
#
# argus-runtime: everything the API, workers and scheduler need - no schema-owner credentials.
apiVersion: v1
kind: Secret
metadata:
  name: argus-runtime
  namespace: argus
type: Opaque
stringData:
  ARGUS_DATABASE__URL: postgresql+asyncpg://argus_app:<password>@<host>:5432/argus
  ARGUS_REDIS__URL: rediss://:<password>@<host>:6380/0
  ARGUS_AUTH__JWT_SIGNING_KEYS: '{"<kid>": "-----BEGIN PRIVATE KEY-----..."}'
  ARGUS_AUTH__JWT_ACTIVE_KID: <kid>
  ARGUS_AUTH__API_KEY_PEPPER: <base64 32 bytes>
  ARGUS_SECURITY__ENCRYPTION_KEYS: '{"k1": "<base64 32 bytes>"}'
  ARGUS_SECURITY__ACTIVE_ENCRYPTION_KEY: <key id, e.g. k1>
  ARGUS_SECURITY__AUDIT_HMAC_KEY: <base64 32 bytes>
  ARGUS_SECURITY__SIGNING_KEY: <base64 32 bytes>
  ARGUS_OBSERVABILITY__METRICS_TOKEN: <random>
  ARGUS_STORAGE__S3_ACCESS_KEY_ID: <id>
  ARGUS_STORAGE__S3_SECRET_ACCESS_KEY: <secret>
  ARGUS_EMAIL__SMTP_PASSWORD: <password>
  ARGUS_LLM__ANTHROPIC_API_KEY: <key, optional>
---
# argus-owner: only for the migration Job and the audit-verification CronJob.
apiVersion: v1
kind: Secret
metadata:
  name: argus-owner
  namespace: argus
type: Opaque
stringData:
  ARGUS_DATABASE__MIGRATION_URL: postgresql+asyncpg://argus_owner:<password>@<host>:5432/argus
