# Argus never talks to the Kubernetes API: no token is mounted into its pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-operator
  annotations:
    argus/purpose: "migrations and audit verification (database owner role)"
automountServiceAccountToken: false
