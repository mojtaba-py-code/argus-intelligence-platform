# Pod Security Admission "restricted" is enforced for the whole namespace: a pod that asks for
# root, privilege escalation, host access or extra capabilities is rejected at admission.
apiVersion: v1
kind: Namespace
metadata:
  name: argus
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
