# Two replicas, one active: the scheduler holds a PostgreSQL advisory lock (leader election), and
# the standby takes over within seconds when the leader's connection ends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-scheduler
  labels: {app.kubernetes.io/component: scheduler}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/component: scheduler}
  template:
    metadata:
      labels: {app.kubernetes.io/component: scheduler}
    spec:
      serviceAccountName: argus
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduler
          image: argus
          args: ["scheduler"]
          ports:
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: argus-config}
            - secretRef: {name: argus-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
