apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-worker
  labels: {app.kubernetes.io/component: worker}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/component: worker}
    spec:
      serviceAccountName: argus
      automountServiceAccountToken: false
      # Draining: running jobs get worker.shutdown_grace_s (30 s) to finish; unfinished ones
      # are released to the queue and resume from their last checkpoint elsewhere.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/component: worker}
      containers:
        - name: worker
          image: argus
          args: ["worker"]
          ports:
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: argus-config}
            - secretRef: {name: argus-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}  # parser sandboxes
