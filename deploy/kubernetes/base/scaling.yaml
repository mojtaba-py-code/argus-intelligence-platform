apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argus-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: argus-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
# Workers scale on CPU here; queue depth (argus_queue_depth) is the better signal - with KEDA's
# Prometheus scaler, target about 50 queued jobs per worker (docs/phases/phase-21-performance.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argus-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: argus-worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 75}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # research jobs are long: do not flap
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: argus-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: argus-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: worker}
