apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-api
  labels: {app.kubernetes.io/component: api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/component: api}
    spec:
      serviceAccountName: argus
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/component: api}
      containers:
        - name: api
          image: argus
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: argus-config}
            - secretRef: {name: argus-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # Let the load balancer stop routing before the process starts draining.
            preStop: {sleep: {seconds: 5}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}  # upload spooling and the parser sandbox
---
apiVersion: v1
kind: Service
metadata:
  name: argus-api
  labels: {app.kubernetes.io/component: api}
spec:
  selector: {app.kubernetes.io/component: api}
  ports:
    - {name: http, port: 80, targetPort: http}
